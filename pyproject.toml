[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nowplay"
version = "0.1.0"
description = "Personal streaming watchlist aggregator (Netflix first)."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
]

[tool.setuptools.packages.find]
where = ["src"]
