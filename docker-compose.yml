# Compose stack for containerHost (the Pi). Portainer already manages
# containerHost as a remote environment and supports Compose stacks per
# environment (see Hosting & Architecture in Notion), so this is written to
# be importable there directly, not just for local `docker compose` use.
#
# Topology (decided 2026-08-06 — see Hosting & Architecture / Data Model /
# Project Plan in Notion, and "DB access and container topology decided" in
# nowplay-project-instructions.md):
#   - Two containers, not three: scraper and website, sharing one volume.
#   - No separate DB container — SQLite isn't a server process, there's
#     nothing to run as a third container.
#   - The scraper is the DB's sole writer (including TMDB enrichment, folded
#     into `scrape all` — see cli.py). The website is read-only, enforced by
#     code discipline rather than a read-only mount (SQLite's WAL mode needs
#     write access to the directory even for readers).
#
# Website service (Phase 3 — built 2026-08-06, see Project Plan). Mounts the
# same ${HOME}/Docker/Nowplay path read-write at the filesystem level (Docker
# doesn't have a clean per-service read-only view of one bind mount shared
# with a read-write writer) — "never write" is enforced in the website's own
# code (app.py never calls a write function in db.py), not by the mount.

services:
  scraper:
    build: .
    image: nowplay-scraper:latest
    # Not a persistent service — a scheduled batch job (cron/systemd on the
    # Pi, or Portainer's own scheduling if preferred), run a few times a
    # week. Automation/scheduling itself isn't built yet (Phase 4 — see
    # Project Plan), so for now this just defines the container; running it
    # unattended on a schedule is separate, not-yet-done work.
    restart: "no"
    volumes:
      # Confirmed 2026-08-06 (first real test on containerHost): the shared
      # data directory is ~/Docker/Nowplay directly, no `data` subfolder —
      # holds nowplay.db, auth state.json files, and debug dumps. Source
      # checkout is separately at ~/Source/Nowplay (that's where this
      # compose file itself lives; `build: .` above refers to it).
      # ${HOME} resolves via the shell's environment when `docker compose`
      # runs — works as long as it's run as the normal Pi user, not e.g.
      # via a stripped-environment sudo. Override with a .env file
      # (NOWPLAY_DATA_DIR=...) if that ever doesn't hold.
      - ${NOWPLAY_DATA_DIR:-${HOME}/Docker/Nowplay}:/app/data
    environment:
      # Required for the TMDB enrichment step folded into `scrape all` —
      # skipped (not fatal) if unset. Set via Portainer's environment
      # variables UI, or a .env file alongside this compose file (not
      # committed — see .gitignore).
      - TMDB_API_KEY=${TMDB_API_KEY:-}

  website:
    build:
      # Context is the repo root, not ./website — the website's Dockerfile
      # needs ../pyproject.toml and ../src too, to install the nowplay
      # package (--no-deps, stdlib-only db.py — see website/Dockerfile for
      # why this doesn't pull in Playwright).
      context: .
      dockerfile: website/Dockerfile
    image: nowplay-website:latest
    restart: unless-stopped   # always-on, unlike the scraper
    volumes:
      - ${NOWPLAY_DATA_DIR:-${HOME}/Docker/Nowplay}:/app/data
    environment:
      - NOWPLAY_DB_PATH=/app/data/nowplay.db
    ports:
      - "8080:8080"           # LAN-only — no reverse proxy / external
                               # exposure needed per current scope
